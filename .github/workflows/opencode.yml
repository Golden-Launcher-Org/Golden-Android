name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write      # <--- Allows pushing directly to repo files/branches
  issues: write        # <--- Allows commenting on issues
  pull-requests: write # <--- Allows creating and editing PRs
  id-token: write

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # <--- Needed for git commits/pushes
          persist-credentials: true # <--- Keeps permissions active for git push

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <--- Pass token so it can push
        with:
          model: openrouter/openrouter/free
          
